# Publishes the hub's image as ghcr.io/segue-music/segue-hub, for amd64, arm64 and armv7 (a Raspberry Pi's), once its
# tests pass: on each push to main that changes the hub, and from the Actions tab ("Run workflow"). It is tagged
# latest and sha-<commit>, the commit it was built from.
name: Hub image

on:
  push:
    branches:
      - main
    paths:
      - 'hub/**'
      - '.github/workflows/hub-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum

      # As CLAUDE.md runs them: gofmt lists the files it would change, so any it lists fails the run.
      - run: go vet ./...
      - run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Its labels name this repository as the image's source, which links the package to it on GitHub.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/segue-hub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # The Dockerfile cross-compiles (hub/Dockerfile), so the arm images build without emulation.
      - uses: docker/build-push-action@v7
        with:
          context: hub
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
