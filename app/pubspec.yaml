name: segue
description: "Spotify-like player for Navidrome and Jellyfin, with Segue Connect"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  audio_service_mpris: ^0.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.10.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
